; Per-directory PHP overrides, safe under both PHP-FPM and mod_php (unlike
; php_value directives in .htaccess, which crash the site with a 500 error
; under PHP-FPM). Raises the limits that most commonly cause a large POST
; field — like a Print Format's HTML template — to be silently truncated
; or dropped on shared hosting.
post_max_size = 32M
upload_max_filesize = 32M
max_input_vars = 5000
max_input_time = 120
max_execution_time = 60
